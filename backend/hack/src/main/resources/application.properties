spring.application.name=hack

spring.config.import=optional:file:../../Docker/.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:credit_db}
spring.datasource.username=${POSTGRES_USER:demo_user}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
